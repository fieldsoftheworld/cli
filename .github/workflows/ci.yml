name: ci

on:
  pull_request:
  push:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.14"
          enable-cache: true
      - run: uv sync --locked --all-extras
      - run: uv run pre-commit run --all-files

  tests:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.12", "3.14"]
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true
      - run: uv sync --locked --all-extras
      - run: uv run pytest
      - if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.14'
        run: uv run pytest -m integration

  conformance:
    # The outputs checked by the validators other tools use: fiboa's and rio-cogeo's.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.14"
          enable-cache: true
      - run: uv sync --locked --all-extras
      - run: uv run python tests/samples.py samples
      - run: uvx --from 'fiboa-cli>=0.21,<0.22' fiboa validate samples/fields.parquet
      - run: uvx --from rio-cogeo rio cogeo validate --strict samples/scores.tif
