name: ci

on:
  pull_request:
  push:
    branches: [main]

# A new push to a branch cancels its run that is still going.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.14"
          enable-cache: true
          # Keep downloaded wheels too, not just ones built from source.
          prune-cache: false
          cache-suffix: ${{ github.job }}
      - run: uv sync --locked --all-extras
      - uses: actions/cache@v6
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ hashFiles('.pre-commit-config.yaml') }}
      - run: uv run pre-commit run --all-files

  tests:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.12", "3.14"]
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true
          # Keep downloaded wheels too, not just ones built from source.
          prune-cache: false
          cache-suffix: ${{ github.job }}
      - run: uv sync --locked --all-extras
      # httpfs and spatial, which every DuckDB connection installs.
      - uses: actions/cache@v6
        with:
          path: ~/.duckdb/extensions
          key: duckdb-${{ runner.os }}-${{ hashFiles('uv.lock') }}
          restore-keys: duckdb-${{ runner.os }}-
      - run: uv run pytest
      - if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.14'
        run: uv run pytest -m integration

  conformance:
    # The outputs checked by the validators other tools use: fiboa's and rio-cogeo's.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.14"
          enable-cache: true
          # Keep downloaded wheels too, not just ones built from source.
          prune-cache: false
          cache-suffix: ${{ github.job }}
      - run: uv sync --locked --all-extras
      - run: uv run python tests/samples.py samples
      - run: uvx --from 'fiboa-cli>=0.21,<0.22' fiboa validate samples/fields.parquet
      - run: uvx --from rio-cogeo rio cogeo validate --strict samples/scores.tif
      # rashid checks whole catalogs, so its metadata findings about the bare sample
      # catalog are expected; rashid_gate.py fails on its data rules (PTL-DAT) only.
      - run: uvx --from 'rashid>=0.3,<0.4' rashid check samples --json --data-scope local > rashid.json || true
      - run: uv run python tests/rashid_gate.py rashid.json
